name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 只有 main 上的 Test 通過（而且是 push 或手動觸發，不是 PR）才部署
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node scripts/check.mjs
      - name: Build site
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          test -n "$APPS_SCRIPT_URL" || { echo "請在 repo 的 Actions variables 設定 APPS_SCRIPT_URL"; exit 1; }
          mkdir -p _site
          sed "s#__APPS_SCRIPT_URL__#${APPS_SCRIPT_URL}#" src/index.html > _site/index.html
          sed "s#__APPS_SCRIPT_URL__#${APPS_SCRIPT_URL}#" src/signup.html > _site/signup.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
