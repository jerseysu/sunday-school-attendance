name: Deploy to Apps Script

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 只有 main 上的 Test 通過（而且是 push 或手動觸發，不是 PR）才部署
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # 沒設定 CLASPRC_JSON 等 secrets 時整個跳過（手動部署也可以用）
    env:
      HAS_CLASP: ${{ secrets.CLASPRC_JSON != '' && secrets.SCRIPT_ID != '' && secrets.DEPLOYMENT_ID != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CLASP != 'true'
        run: echo "::notice::尚未設定 CLASPRC_JSON / SCRIPT_ID / DEPLOYMENT_ID，跳過自動部署 Apps Script"
      - uses: actions/checkout@v4
        if: env.HAS_CLASP == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        if: env.HAS_CLASP == 'true'
        with:
          node-version: 20

      - name: Syntax check
        if: env.HAS_CLASP == 'true'
        run: node scripts/check.mjs

      - name: Write clasp credentials
        if: env.HAS_CLASP == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json

      - name: Push code
        if: env.HAS_CLASP == 'true'
        run: npx --yes @google/clasp@2.4.2 push --force

      - name: Update the live web app (same URL)
        if: env.HAS_CLASP == 'true'
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Accept either the bare ID or the full /exec URL, and drop stray spaces/newlines
          ID=$(printf '%s' "$DEPLOYMENT_ID" | tr -d '[:space:]' | sed -E 's#^.*/s/([^/]+)/(exec|dev).*$#\1#')
          echo "Deployment ID: ${ID:0:8}…${ID: -6} (${#ID} chars)"
          case "$ID" in AKfy*) ;; *) echo "::error::DEPLOYMENT_ID should start with AKfy (the part between /s/ and /exec)"; exit 1;; esac
          echo "Existing deployments:"
          npx --yes @google/clasp@2.4.2 deployments || true
          npx --yes @google/clasp@2.4.2 deploy --deploymentId "$ID" --description "${HEAD_SHA::7} via GitHub Actions"
