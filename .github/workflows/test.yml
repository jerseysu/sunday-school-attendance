name: Test

# 每次 push（含 main）與 PR 都會跑。main 上通過之後，
# 「Deploy to GitHub Pages」和「Deploy to Apps Script」才會接著部署這個 commit。
# 想手動重新部署：Actions › Test › Run workflow（選 main）。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check.mjs

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install "playwright>=1.47,<2"
          python -m playwright install --with-deps chromium
      - name: Run tests (real Code.gs against a mock spreadsheet)
        run: python tests/run_e2e.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/e2e-out
          if-no-files-found: ignore
          retention-days: 7
